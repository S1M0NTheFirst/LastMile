# Machine A: robot1-5 from a single image ("lastmile").
# Robots on this machine share a bridge network (robot-net) and reach each
# other by container name. robot6-10 live on machine B and are reached at
# MACHINE_B_IP + their published port (set it in .env, see .env.example).
#
#   docker compose up --build -d
#
# Robot ports are published to the host as 8001..8005 so machine B (and the
# simulator) can reach them over the LAN.

x-robot: &robot
  image: lastmile
  build: ./robot
  networks:
    - robot-net
  restart: unless-stopped

services:
  robot1:
    <<: *robot
    container_name: robot1
    environment:
      ROBOT_ID: robot1
      PEERS: robot2,robot3,robot4,robot5,robot6=${MACHINE_B_IP:-machine-b}:8006,robot7=${MACHINE_B_IP:-machine-b}:8007,robot8=${MACHINE_B_IP:-machine-b}:8008,robot9=${MACHINE_B_IP:-machine-b}:8009,robot10=${MACHINE_B_IP:-machine-b}:8010
    ports:
      - "8001:8000"

  robot2:
    <<: *robot
    container_name: robot2
    environment:
      ROBOT_ID: robot2
      PEERS: robot1,robot3,robot4,robot5,robot6=${MACHINE_B_IP:-machine-b}:8006,robot7=${MACHINE_B_IP:-machine-b}:8007,robot8=${MACHINE_B_IP:-machine-b}:8008,robot9=${MACHINE_B_IP:-machine-b}:8009,robot10=${MACHINE_B_IP:-machine-b}:8010
    ports:
      - "8002:8000"

  robot3:
    <<: *robot
    container_name: robot3
    environment:
      ROBOT_ID: robot3
      PEERS: robot1,robot2,robot4,robot5,robot6=${MACHINE_B_IP:-machine-b}:8006,robot7=${MACHINE_B_IP:-machine-b}:8007,robot8=${MACHINE_B_IP:-machine-b}:8008,robot9=${MACHINE_B_IP:-machine-b}:8009,robot10=${MACHINE_B_IP:-machine-b}:8010
    ports:
      - "8003:8000"

  robot4:
    <<: *robot
    container_name: robot4
    environment:
      ROBOT_ID: robot4
      PEERS: robot1,robot2,robot3,robot5,robot6=${MACHINE_B_IP:-machine-b}:8006,robot7=${MACHINE_B_IP:-machine-b}:8007,robot8=${MACHINE_B_IP:-machine-b}:8008,robot9=${MACHINE_B_IP:-machine-b}:8009,robot10=${MACHINE_B_IP:-machine-b}:8010
    ports:
      - "8004:8000"

  robot5:
    <<: *robot
    container_name: robot5
    environment:
      ROBOT_ID: robot5
      PEERS: robot1,robot2,robot3,robot4,robot6=${MACHINE_B_IP:-machine-b}:8006,robot7=${MACHINE_B_IP:-machine-b}:8007,robot8=${MACHINE_B_IP:-machine-b}:8008,robot9=${MACHINE_B_IP:-machine-b}:8009,robot10=${MACHINE_B_IP:-machine-b}:8010
    ports:
      - "8005:8000"

networks:
  robot-net:
    name: robot-net
    driver: bridge
